version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "07:00"
    groups:
      all:
        patterns: ["*"]

# Remove this ignore once this ticket is resolved
# https://jira.atl.workiva.net/browse/CID-7580
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
